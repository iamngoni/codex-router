[package]
name = "codex-router"
version = "0.1.0"
edition = "2024"
description = "Local reverse proxy that lets Codex route different model-name prefixes to different providers, translating Responses<->Chat Completions where a provider doesn't speak the Responses API."
publish = false

[dependencies]
actix-web = "4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }

[profile.release]
opt-level = 2
